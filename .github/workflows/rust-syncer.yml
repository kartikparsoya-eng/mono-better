name: Rust Syncer

# CI for the Rust-based zero image on the rust-cvr-v1.0.0 line.
#
# Unlike rust-ivm.yml (which builds the NAPI-addon-in-node image), this branch
# ships zero-cache running the STANDALONE rust-syncer binary (ZERO_SYNCER=rust,
# ZERO_RUST_SYNCER_PATH=/usr/local/bin/rust-syncer). So this workflow:
#   1. checks all three Rust crates (rust-ivm, rust-cvr, rust-syncer), and
#   2. builds/pushes + verifies + scans the rust-syncer zero image.
# Modeled on rust-ivm.yml (pinned action SHAs, persist-credentials: false).

on:
  # Push-triggered CI disabled 2026-09-01: we iterate on rust-cvr-v1.0.0 by
  # pushing and rebuilding the zero image directly on the test box, so the full
  # 3-crate check + image build/push on every push only slows the
  # pull→rebuild→replay loop. Re-enable by uncommenting the two lines below.
  # Manual (workflow_dispatch), PR, and the nightly schedule are unchanged.
  # push:
  #   branches: [rust-cvr-v1.0.0]
  pull_request:
    branches: [rust-cvr-v1.0.0]
  workflow_dispatch:
  # Recurring quality jobs (coverage / sanitizers / fuzz smoke) are slow and/or
  # docker-in-docker, so they run nightly + on demand rather than on every PR.
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC daily

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-checks:
    name: Rust fmt/clippy/test (ivm, cvr, syncer)
    runs-on: ubuntu-latest
    # rust-cvr / rust-syncer PG integration tests are gated on TEST_CVR_PG_URI;
    # a Postgres service makes them actually run (they skip + pass when unset).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rust_syncer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_CVR_PG_URI: postgres://postgres:postgres@localhost:5432/rust_syncer_test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Pin the toolchain so clippy lints are REPRODUCIBLE. The runner image
      # floats to the latest rust (e.g. 1.97), whose newer clippy lints (e.g.
      # result_large_err) can break `-D warnings` unpredictably on an image bump
      # and diverge from local dev. 1.90.0 is the version the crates are verified
      # clean against; bump this deliberately (and fix any new lints) when moving.
      - name: Pin Rust toolchain
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component clippy,rustfmt
          rustup default 1.90.0
          rustc --version
          cargo clippy --version

      # rust-ivm links a WAL2 SQLite; rust-syncer depends on rust-ivm, so build
      # the static lib once and export its location for every cargo invocation.
      - name: Build static WAL2 SQLite for tests
        working-directory: packages/rust-ivm
        run: |
          BUILD=$(scripts/build-wal2-static-lib.sh)
          echo "SQLITE3_LIB_DIR=$BUILD" >> "$GITHUB_ENV"
          echo "SQLITE3_INCLUDE_DIR=$BUILD" >> "$GITHUB_ENV"
          echo "SQLITE3_STATIC=1" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_LIBDIR=$(mktemp -d)" >> "$GITHUB_ENV"

      - name: rust-ivm — fmt, clippy, test
        working-directory: packages/rust-ivm
        # clippy --all-targets compile-checks the criterion bench (ivm_hot_bench);
        # the test step uses `--tests` (not `--all-targets`) so it does NOT try to
        # RUN the bench — a criterion (harness=false) binary rejects libtest's
        # `--test-threads=1` with "unexpected argument". `--tests` still covers the
        # lib unit tests + all integration tests + bin-as-test targets.
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --tests -- --test-threads=1

      - name: rust-cvr — fmt, clippy, test
        working-directory: packages/rust-cvr
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked -- --test-threads=1

      - name: rust-syncer — fmt, clippy, test
        working-directory: packages/rust-syncer
        # `--no-default-features` matches how the binary SHIPS (Dockerfile): it
        # drops the `non-wal2-test-support` escape hatch so the crate links ONLY
        # the WAL2 static SQLite (from the env above). With default features on,
        # the test/bin link pulls a second SQLite → rust-lld "duplicate symbol:
        # sqlite3_*". (clippy alone passed because `check` does not link.)
        run: |
          # rust-syncer's build.rs statically links the WAL2 amalgamation
          # itself (like the Dockerfile). The SQLITE3_STATIC/SQLITE3_LIB_DIR env
          # set for the rust-ivm/rust-cvr steps would link a SECOND SQLite here
          # → rust-lld "duplicate symbol: sqlite3_*". Match the Dockerfile: build
          # the syncer with build.rs-only linking (no SQLITE3_* env).
          unset SQLITE3_STATIC SQLITE3_LIB_DIR SQLITE3_INCLUDE_DIR PKG_CONFIG_LIBDIR
          cargo fmt --check
          cargo clippy --locked --no-default-features --all-targets -- -D warnings
          cargo test --locked --no-default-features -- --test-threads=1

      - name: Repeated teardown integrity soak (rust-ivm)
        working-directory: packages/rust-ivm
        env:
          RUST_IVM_SOAK_CYCLES: 500
        run: cargo test --locked --test teardown_gate_test -- --test-threads=1

  # ---- Recurring quality jobs (nightly schedule + manual dispatch only) -------
  # Kept OFF the PR/push fast path: coverage instruments every crate, the
  # sanitizer legs run a nightly-slim container, and the fuzz smoke links the
  # heavy syncer deps — all too slow to block a PR. They gate regressions on a
  # daily cadence instead.

  coverage:
    name: Test coverage (3 crates)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rust_syncer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Lets the rust-cvr PG suites actually run (they count toward coverage
      # instead of skipping) — see parity/repo-coverage.sh's TEST_CVR_PG_URI :? guard.
      TEST_CVR_PG_URI: postgres://postgres:postgres@localhost:5432/rust_syncer_test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Pin Rust toolchain
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component llvm-tools-preview
          rustup default 1.90.0
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked --version 0.6.13
      - name: Build static WAL2 SQLite (rust-ivm coverage leg)
        working-directory: packages/rust-ivm
        run: scripts/build-wal2-static-lib.sh
      - name: Coverage (repo-coverage.sh)
        run: bash parity/repo-coverage.sh
      - name: Upload coverage summaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-coverage
          if-no-files-found: warn
          retention-days: 14
          path: |
            parity/coverage/*/summary.txt
            parity/coverage/*/uncovered-functions.txt

  sanitize:
    name: Sanitizers (ASan/LSan)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # parity/sanitize.sh is self-contained: it runs a rustlang/rust:nightly-slim
      # container that installs its own pinned nightly + rust-src and compiles the
      # repo's WAL2 SQLite (scanstatus_v2) into the multiarch libdir. rust-cvr +
      # rust-ivm carry the Rc-cycle/RefCell/unsafe surface (ivm = where the G6
      # operator-graph leak lived), so their ASan+LSan legs are the hard gate.
      - name: ASan + LSan (rust-cvr, rust-ivm)
        run: bash parity/sanitize.sh asan

  fuzz-smoke:
    name: Fuzz smoke (60s per target)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # cargo-fuzz drives an internal nightly; `--locked` is required because the
      # host stable is older than a transitive dep's rustc floor. parse_upstream /
      # connect_params link the heavy syncer deps (reqwest/ring) that FAIL to link
      # on macOS locally — they link cleanly here on Linux, which is the point.
      - name: Install nightly + cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked
      - name: Fuzz each target (60s, fail on crash)
        working-directory: packages/rust-syncer
        run: |
          set -euo pipefail
          for t in version_string parse_upstream connect_params; do
            echo "== fuzz $t =="
            cargo +nightly fuzz run "$t" -- -max_total_time=60 -rss_limit_mb=4096
          done
      - name: Upload fuzz crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashes
          if-no-files-found: ignore
          retention-days: 14
          path: packages/rust-syncer/fuzz/artifacts/**

  docker-build:
    name: Build and push rust-syncer zero image
    runs-on: ubuntu-latest
    needs: [rust-checks]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/rust-cvr-v1.0.0')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}/zero-cache-rust-syncer
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value={{branch}}-latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published runtime image
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}/zero-cache-rust-syncer@${{ steps.build.outputs.digest }}
        run: |
          docker pull "$IMAGE_REF"
          size=$(docker image inspect "$IMAGE_REF" --format '{{.Size}}')
          echo "image size: $((size / 1024 / 1024)) MiB"
          # Soft budget — flip to `test "$size" -le ...` to hard-enforce once the
          # steady-state size is known.
          if [ "$size" -gt $((900 * 1024 * 1024)) ]; then
            echo "::warning::rust-syncer image exceeds 900 MiB ($((size / 1024 / 1024)) MiB)"
          fi
          docker run --rm --entrypoint sh "$IMAGE_REF" -lc '
            # Engine selection — this image runs the STANDALONE Rust syncer.
            test "$ZERO_SYNCER" = rust
            test "$ZERO_RUST_SYNCER_PATH" = /usr/local/bin/rust-syncer
            test -x /usr/local/bin/rust-syncer
            # In-image binary/config paths (required image-internal env).
            test "$ZERO_LITESTREAM_EXECUTABLE" = /usr/local/bin/litestream
            test "$ZERO_LITESTREAM_EXECUTABLE_V5" = /usr/local/bin/litestream-v5
            test "$ZERO_LITESTREAM_CONFIG_PATH" = /etc/litestream.yml
            test -f /etc/litestream.yml
            # Baked image defaults.
            test "$MALLOC_ARENA_MAX" = 2
            test "$UV_THREADPOOL_SIZE" = 16
            test "$ZERO_LOG_FORMAT" = json
            # Dispatcher/runtime tuning baked into the image.
            test "$ZERO_ROUND_ROBIN_ROUTING" = 1
            test "$ZERO_CURSOR_PAGE_SIZE" = 100
            test "$ZERO_NUM_SYNC_WORKERS" = 4
            # Backup replicators must be present and the expected versions.
            litestream version | grep -Fx "0.3.13+z0.0.9"
            litestream-v5 version | grep -Fx "0.5.11"
            # The node dispatcher (entrypoint) must be runnable.
            command -v node >/dev/null
          '

      - name: Scan published image for critical vulnerabilities
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}/zero-cache-rust-syncer@${{ steps.build.outputs.digest }}
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.66.0@sha256:086971aaf400beebd94e8300fd8ea623774419597169156cec56eec5b00dfb1e
          image --quiet --exit-code 1 --scanners vuln --severity CRITICAL
          --ignore-unfixed "$IMAGE_REF"
