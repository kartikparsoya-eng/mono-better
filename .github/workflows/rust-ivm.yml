name: Rust IVM

on:
  push:
    branches: [rust-ivm-v1.7.0]
  pull_request:
    branches: [rust-ivm-v1.7.0]

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-test:
    name: Rust correctness and lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Rust formatting
        working-directory: packages/rust-ivm
        run: cargo fmt --check

      - name: Rust lint
        working-directory: packages/rust-ivm
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build static WAL2 SQLite for tests
        working-directory: packages/rust-ivm
        run: |
          BUILD=$(scripts/build-wal2-static-lib.sh)
          echo "SQLITE3_LIB_DIR=$BUILD" >> "$GITHUB_ENV"
          echo "SQLITE3_INCLUDE_DIR=$BUILD" >> "$GITHUB_ENV"
          echo "SQLITE3_STATIC=1" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_LIBDIR=$(mktemp -d)" >> "$GITHUB_ENV"

      - name: Rust unit and integration tests
        working-directory: packages/rust-ivm
        run: cargo test --locked --all-targets -- --test-threads=1

      - name: Repeated teardown integrity soak
        working-directory: packages/rust-ivm
        env:
          RUST_IVM_SOAK_CYCLES: 500
        run: cargo test --locked --test teardown_gate_test -- --test-threads=1
