name: Rust IVM

on:
  push:
    branches: [rust-ivm-v1.7.0]
  pull_request:
    branches: [rust-ivm-v1.7.0]

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-test:
    name: Rust correctness and lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Rust formatting
        working-directory: packages/rust-ivm
        run: cargo fmt --check

      - name: Rust lint
        working-directory: packages/rust-ivm
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Rust unit and integration tests
        working-directory: packages/rust-ivm
        run: cargo test --locked --all-targets -- --test-threads=1

      - name: Repeated teardown integrity soak
        working-directory: packages/rust-ivm
        env:
          RUST_IVM_SOAK_CYCLES: 500
        run: cargo test --locked --test teardown_gate_test -- --test-threads=1

  addon-build:
    name: Static WAL2 addon and type boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.5.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          cache: pnpm

      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config
      - run: pnpm install --frozen-lockfile

      - name: Generated NAPI declarations are current
        run: |
          pnpm --dir packages/rust-ivm/napi build
          git diff --exit-code -- packages/rust-ivm/napi/index.d.ts
          if rg -n '(:|<|\||,)\s*any(\s|>|\[|\]|,|;|\|)' packages/rust-ivm/napi/index.d.ts; then
            echo 'Generated NAPI declarations contain an untyped any' >&2
            exit 1
          fi

      - name: Build statically linked WAL2 addon
        run: packages/rust-ivm/scripts/build-local-wal2.sh

      - name: Type-check the production driver
        run: pnpm exec tsc -p packages/zero-cache/tsconfig.json --noEmit

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-ivm-addon
          path: packages/rust-ivm/napi/rust-ivm.node
          if-no-files-found: error

  driver-parity:
    name: Driver parity seeds ${{ matrix.start }}-${{ matrix.end }}
    needs: addon-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - start: 0
            end: 249
          - start: 250
            end: 499
          - start: 500
            end: 749
          - start: 750
            end: 999
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.5.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rust-ivm-addon
          path: packages/rust-ivm/napi

      - name: Exact stateful differential corpus
        env:
          RUST_IVM_ADDON_PATH: ${{ github.workspace }}/packages/rust-ivm/napi/rust-ivm.node
          DRIVER_FUZZ_START: ${{ matrix.start }}
          DRIVER_FUZZ_SEEDS: 250
        run: >-
          pnpm exec vitest run --testTimeout=30000
          packages/zero-cache/src/services/view-syncer/rust-ivm-driver.fuzz.test.ts

  fault-and-soak:
    name: Driver boundaries, faults, and backpressure soak
    needs: addon-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.5.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rust-ivm-addon
          path: packages/rust-ivm/napi

      - name: Boundary, lifecycle, and fault suite
        env:
          RUST_IVM_ADDON_PATH: ${{ github.workspace }}/packages/rust-ivm/napi/rust-ivm.node
          RUST_IVM_SOAK_ROWS: 1000
        run: >-
          pnpm exec vitest run
          packages/zero-cache/src/services/view-syncer/rust-ivm-driver.getrow.test.ts
          packages/zero-cache/src/services/view-syncer/rust-ivm-driver.differential.test.ts
          packages/zero-cache/src/services/view-syncer/rust-ivm-driver.backpressure.test.ts
          packages/zero-cache/src/services/view-syncer/rust-ivm-driver.error-propagation.test.ts
          packages/zero-cache/src/services/view-syncer/rust-ivm-driver.async-queue.test.ts
          packages/zero-cache/src/services/view-syncer/rust-ivm-driver.planner.test.ts

      - name: Exact NAPI advance fixture corpus
        env:
          RUST_IVM_ADDON: ${{ github.workspace }}/packages/rust-ivm/napi/rust-ivm.node
          RUST_IVM_RUN_NAPI_ADVANCE_FIXTURES: 1
        run: >-
          cargo test --locked
          --manifest-path packages/rust-ivm/Cargo.toml
          --test advance_fixture_replay_test -- --nocapture

  docker-build:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: [rust-test, addon-build, driver-parity, fault-and-soak]
    if: github.event_name == 'push' && github.ref == 'refs/heads/rust-ivm-v1.7.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}/zero-cache-rust-ivm
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value={{branch}}-latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published runtime image
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}/zero-cache-rust-ivm@${{ steps.build.outputs.digest }}
        run: |
          docker pull "$IMAGE_REF"
          size=$(docker image inspect "$IMAGE_REF" --format '{{.Size}}')
          test "$size" -le $((600 * 1024 * 1024))
          docker run --rm --entrypoint sh "$IMAGE_REF" -lc '
            test "$RUST_IVM_TSFN_QUEUE" = 64
            test "$RUST_IVM_STREAM_CREDIT" = 64
            test "$ZERO_NUM_SYNC_WORKERS" = 4
            test -z "${RUST_IVM_TSFN_BATCH:-}"
            litestream version | grep -Fx "0.3.13+z0.0.9"
            litestream-v5 version | grep -Fx "0.5.11"
            test ! -e /usr/local/lib/node_modules/npm
            cd /app/mono
            zero_sqlite=$(find "$PWD/node_modules/.pnpm" -path "*/@rocicorp/zero-sqlite3/build/Release/better_sqlite3.node" -print -quit)
            NODE_OPTIONS= node -e '\''
              const fs = require("fs");
              require(process.argv[1]);
              require("./packages/rust-ivm/napi/rust-ivm.node");
              const libraries = [...new Set(fs.readFileSync("/proc/self/maps", "utf8")
                .split("\n")
                .filter(line => line.includes("/libsqlite3.so"))
                .map(line => line.trim().split(/ +/).at(-1)))];
              if (libraries.length !== 1 || libraries[0] !== "/usr/local/lib/libsqlite3.so.0") {
                throw new Error(`expected one shared SQLite library, got ${JSON.stringify(libraries)}`);
              }
            '\'' "$zero_sqlite"
          '

      - name: Scan published image for critical vulnerabilities
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}/zero-cache-rust-ivm@${{ steps.build.outputs.digest }}
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.66.0@sha256:086971aaf400beebd94e8300fd8ea623774419597169156cec56eec5b00dfb1e
          image --quiet --exit-code 1 --scanners vuln --severity CRITICAL
          --ignore-unfixed "$IMAGE_REF"
