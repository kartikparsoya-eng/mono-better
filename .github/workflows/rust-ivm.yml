name: Rust IVM

on:
  push:
    branches: [rust-ivm-v1.7.0]
    paths:
      - 'packages/rust-ivm/**'
      - 'packages/zero-cache/src/services/view-syncer/rust-ivm-driver.ts'
      - 'Dockerfile'
      - '.github/workflows/rust-ivm.yml'
  pull_request:
    branches: [rust-ivm-v1.7.0]
    paths:
      - 'packages/rust-ivm/**'
      - 'packages/zero-cache/src/services/view-syncer/rust-ivm-driver.ts'
      - 'Dockerfile'
      - '.github/workflows/rust-ivm.yml'

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-checks:
    name: Rust fmt / clippy / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/rust-ivm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/rust-ivm/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('packages/rust-ivm/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test -- --test-threads=1

  fixture-replay:
    name: Fixture replay regression suite
    runs-on: ubuntu-latest
    needs: rust-checks
    defaults:
      run:
        working-directory: packages/rust-ivm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/rust-ivm/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('packages/rust-ivm/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run fixture replay tests
        run: cargo test --test fixture_replay_test --test advance_fixture_replay_test -- --test-threads=1

  napi-build:
    name: Build NAPI addon
    runs-on: ubuntu-latest
    needs: rust-checks
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/rust-ivm/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('packages/rust-ivm/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc pkg-config

      - name: Build WAL2 SQLite
        working-directory: packages/rust-ivm
        run: |
          gcc -O2 -ffp-contract=off -fPIC -c wal2-sqlite/sqlite3.c -o /tmp/sqlite3.o \
            -DSQLITE_THREADSAFE=2 \
            -DSQLITE_ENABLE_FTS5 \
            -DSQLITE_ENABLE_JSON1 \
            -DSQLITE_ENABLE_RTREE \
            -DSQLITE_OMIT_LOAD_EXTENSION \
            -DSQLITE_ENABLE_SNAPSHOT \
            -DSQLITE_ENABLE_WAL2_COREAD
          sudo ar rcs /usr/lib/libsqlite3.a /tmp/sqlite3.o
          sudo cp wal2-sqlite/sqlite3.h /usr/include/sqlite3.h
          sudo cp wal2-sqlite/sqlite3ext.h /usr/include/sqlite3ext.h

      - name: Build NAPI addon
        working-directory: packages/rust-ivm/napi
        run: |
          cargo build --release
          cp target/release/librust_ivm_napi.so rust-ivm.node

      - name: Upload addon artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-ivm-node-linux-x64
          path: packages/rust-ivm/napi/rust-ivm.node
          retention-days: 7

  docker-build:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: [rust-checks, napi-build, fixture-replay]
    if: github.event_name == 'push' && github.ref == 'refs/heads/rust-ivm-v1.7.0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2320ee5ddab2c036d3d9 # v3.10.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ghcr.io/${{ github.repository }}/zero-cache-rust-ivm
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value={{branch}}-latest

      - name: Build and push
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a9 # v6.15.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
