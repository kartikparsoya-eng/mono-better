name: Build & publish zero-cache+go image

# Builds packages/zero-cache/Dockerfile.go-ivm, which pulls libgoivm.so
# (the in-process Go IVM engine) from ghcr.io/kartikparsoya-eng/go-ivm
# and bundles it with zero-cache. Publishes to
# ghcr.io/kartikparsoya-eng/zero-cache-go.
#
# ONE variant (removal sweep, protocolRev 10 — napi is the only
# transport; the socket sidecar binary and the shadow/drift-audit modes
# are gone):
#   - napi-tablesrc: Go-primary over the IN-PROCESS (NAPI) transport —
#                    each syncer worker dlopens libgoivm.so: no socket,
#                    no per-frame syscalls, per-row Go→JS delivery,
#                    pull-based streaming hydrate + push-based streaming
#                    advance (advanceToHeadStream), streaming+parallel
#                    engine defaults (chunk 100 / parallelism 4 / warm
#                    pool / lazy + parallel advance). Bundles
#                    go-ivm:feat-napi-transport (artifact-carrier image
#                    whose only payload is libgoivm.so).
#                    tags: napi-tablesrc-...
#
# `pull: true` forces the build to re-fetch the go-ivm image so the
# chain "push to go-ivm → push to mono" reliably bundles the latest
# libgoivm.so.

on:
  push:
    branches:
      - feat/napi-transport
    tags: ['v*']
  pull_request:
    branches:
      - feat/napi-transport
    paths:
      # Only run on PRs that touch files the docker build cares about,
      # so unrelated PRs don't pay the multi-minute build cost. Must cover
      # EVERY workspace package in zero-cache's dependency closure (the
      # Dockerfile COPYs each package.json and pnpm installs the closure) —
      # napi review M9: zero-events/zero-permissions/zero-types/otel/zqlite
      # were missing, so PRs touching only those skipped the image build
      # that would have caught their breakage.
      - 'packages/zero-cache/**'
      - 'packages/zero-protocol/**'
      - 'packages/zero-schema/**'
      - 'packages/zero-events/**'
      - 'packages/zero-permissions/**'
      - 'packages/zero-types/**'
      - 'packages/zql/**'
      - 'packages/zqlite/**'
      - 'packages/shared/**'
      - 'packages/otel/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/build-zero-cache-go.yml'
  workflow_dispatch:
  # Fired by the go-ivm "Build & publish sidecar image" workflow after a
  # new go-ivm image is pushed to GHCR. This eliminates the race where a
  # marker commit to this repo could trigger a rebuild BEFORE go-ivm
  # finishes publishing, causing the bundled libgoivm.so to be one
  # version stale. See go-ivm/.github/workflows/build-image.yml's
  # `notify-downstream` job for the dispatcher.
  repository_dispatch:
    types: [go-ivm-published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/zero-cache-go

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # In-process (NAPI) Go-primary — the feat/napi-transport lineage.
          # Each syncer worker loads the Go engine IN-PROCESS (dlopen
          # libgoivm.so via the goivm_napi addon). Chunk/hydrate/advance
          # args left EMPTY so Go code defaults apply (chunk=100,
          # hydrate parallelism=4, advance parallelism=4, warm pool +
          # lazy/parallel advance ON). CURSOR_PAGE_SIZE=100 pairs the TS
          # consumer side with the 100-row emit default. Sticky
          # load-aware syncer routing is ON in the prod image; controlled
          # rehome stays empty/off because it actively drains live CGs.
          # Requires the
          # go-ivm build workflow to publish feat-napi-transport (its
          # Dockerfile ships libgoivm.so), else the unconditional COPY in
          # Dockerfile.go-ivm fails this build loudly.
          - mode: napi-tablesrc
            go_ivm_image: "ghcr.io/kartikparsoya-eng/go-ivm:feat-napi-transport"
            tag_prefix: "napi-tablesrc-"
            hydrate_chunk_size_arg: ""
            advance_chunk_size_arg: ""
            hydrate_parallelism_arg: ""
            advance_parallelism_arg: ""
            cursor_page_size_arg: "100"
            syncer_load_aware_routing_arg: "1"
            syncer_controlled_rehome_arg: ""

    name: build (${{ matrix.mode }})

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # Needed for both push (write) and pulling the go-ivm base image
        # if it's private. Harmless when go-ivm image is public.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # The flavor prefix is applied to tags that DON'T set their own
          # prefix (type=ref, type=raw, latest). type=sha sets its own
          # prefix=sha- by default, which would OVERRIDE the flavor prefix —
          # so we set its prefix explicitly below to keep the variant prefix.
          flavor: |
            prefix=${{ matrix.tag_prefix }},onlatest=true
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            # Variant-prefixed sha tag (kept explicit so the prefix survives
            # type=sha's own default prefix).
            type=sha,format=short,prefix=${{ matrix.tag_prefix }}sha-
            # Guaranteed-unique-per-build handle. The same mono commit is
            # rebuilt by the downstream go-ivm dispatch with a fresh
            # libgoivm.so, so a commit sha alone is NOT unique per build; the
            # run id is. Pin deploys to `<prefix>run-<id>` for an immutable
            # image.
            type=raw,value=run-${{ github.run_id }}

      - name: Build & push image (${{ matrix.mode }})
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/zero-cache/Dockerfile.go-ivm
          platforms: linux/amd64
          # Force-pull the go-ivm base image so we always bundle the
          # latest libgoivm.so — without this, a cached older version
          # would silently get baked in.
          pull: true
          # PRs build (verifies the Dockerfile still compiles) but
          # don't push (no image churn from forks).
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            GO_IVM_IMAGE=${{ matrix.go_ivm_image }}
            HYDRATE_CHUNK_SIZE=${{ matrix.hydrate_chunk_size_arg }}
            ADVANCE_CHUNK_SIZE=${{ matrix.advance_chunk_size_arg }}
            HYDRATE_PARALLELISM=${{ matrix.hydrate_parallelism_arg }}
            ADVANCE_PARALLELISM=${{ matrix.advance_parallelism_arg }}
            CURSOR_PAGE_SIZE=${{ matrix.cursor_page_size_arg }}
            SYNCER_LOAD_AWARE_ROUTING=${{ matrix.syncer_load_aware_routing_arg }}
            SYNCER_CONTROLLED_REHOME=${{ matrix.syncer_controlled_rehome_arg }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache scoped per-matrix-variant (single variant today; keeps
          # the scope stable if more are ever added).
          cache-from: type=gha,scope=${{ matrix.mode }}
          cache-to: type=gha,mode=max,scope=${{ matrix.mode }}
