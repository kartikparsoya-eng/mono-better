name: Build & publish zero-cache+go image

# Builds packages/zero-cache/Dockerfile.go-ivm, which pulls the Go IVM
# binary from ghcr.io/kartikparsoya-eng/go-ivm and bundles it with
# zero-cache. Publishes to ghcr.io/kartikparsoya-eng/zero-cache-go.
#
# Two variants are published from the same Dockerfile + same source,
# differing only in the SHADOW_MODE build arg:
#   - primary: Go-primary (Go serves clients) → tags: latest, sha-...,
#              branch name
#   - shadow:  TS source of truth, Go in parallel for drift audit →
#              tags: shadow-latest, shadow-sha-..., shadow-<branch>
#
# `pull: true` forces the build to re-fetch the go-ivm image so the
# chain "push to go-ivm → push to mono" reliably bundles the latest
# sidecar binary in both variants.

on:
  push:
    branches:
      - feat/go-ivm-sidecar-async-advance
    tags: ['v*']
  pull_request:
    branches:
      - feat/go-ivm-sidecar-async-advance
    paths:
      # Only run on PRs that touch files the docker build cares about,
      # so unrelated PRs don't pay the multi-minute build cost.
      - 'packages/zero-cache/**'
      - 'packages/zero-protocol/**'
      - 'packages/zero-schema/**'
      - 'packages/zql/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-zero-cache-go.yml'
  workflow_dispatch:
  # Fired by the go-ivm "Build & publish sidecar image" workflow after a
  # new sidecar image is pushed to GHCR. This eliminates the race where a
  # marker commit to this repo could trigger a rebuild BEFORE go-ivm
  # finishes publishing, causing the bundled binary to be one version
  # stale. See go-ivm/.github/workflows/build-image.yml's
  # `notify-downstream` job for the dispatcher.
  repository_dispatch:
    types: [go-ivm-published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/zero-cache-go

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: primary
            shadow_mode_arg: "false"
            source_mode_arg: "memory"
            go_ivm_image: "ghcr.io/kartikparsoya-eng/go-ivm:latest"
            tag_prefix: ""
          - mode: shadow
            shadow_mode_arg: "true"
            source_mode_arg: "memory"
            go_ivm_image: "ghcr.io/kartikparsoya-eng/go-ivm:latest"
            tag_prefix: "shadow-"
          # TableSource port — Go-primary leaf reads SQLite directly
          # (see go-ivm/DESIGN-tablesource-port.md). Bundles the sidecar
          # built from the feat branch so the new internal/tablesource
          # package is present in the binary. Tagged tablesrc-* so it
          # never collides with the production primary/shadow tags.
          - mode: tablesrc
            shadow_mode_arg: "false"
            source_mode_arg: "table"
            go_ivm_image: "ghcr.io/kartikparsoya-eng/go-ivm:feat-go-tablesource-port"
            tag_prefix: "tablesrc-"

    name: build (${{ matrix.mode }})

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # Needed for both push (write) and pulling the go-ivm base image
        # if it's private. Harmless when go-ivm image is public.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # The prefix applies to ALL generated tags, including the raw
          # `latest`. So the primary variant publishes `latest`, the
          # shadow variant publishes `shadow-latest`, etc.
          flavor: |
            prefix=${{ matrix.tag_prefix }},onlatest=true
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/feat/go-ivm-sidecar-async-advance' }}

      - name: Build & push image (${{ matrix.mode }})
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/zero-cache/Dockerfile.go-ivm
          # Force-pull the go-ivm base image so we always bundle the
          # latest sidecar binary — without this, a cached older
          # version would silently get baked in.
          pull: true
          # PRs build (verifies the Dockerfile still compiles) but
          # don't push (no image churn from forks).
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            SHADOW_MODE=${{ matrix.shadow_mode_arg }}
            SOURCE_MODE=${{ matrix.source_mode_arg }}
            GO_IVM_IMAGE=${{ matrix.go_ivm_image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache scoped per-matrix-variant so primary and shadow don't
          # invalidate each other (they share most layers but the final
          # ENV layer differs).
          cache-from: type=gha,scope=${{ matrix.mode }}
          cache-to: type=gha,mode=max,scope=${{ matrix.mode }}
