name: Build & publish zero-cache+go image

# Builds packages/zero-cache/Dockerfile.go-ivm, which pulls the Go IVM
# binary from ghcr.io/kartikparsoya-eng/go-ivm and bundles it with
# zero-cache. Publishes to ghcr.io/kartikparsoya-eng/zero-cache-go.
#
# Three variants are published from the same Dockerfile + same mono
# source, differing in build args (SHADOW_MODE / GO_PRIMARY_TRIGGER /
# LEAN_PRIMARY / ...) and the bundled go-ivm sidecar binary (GO_IVM_IMAGE):
#   - tablesrc:           Go-primary, table source, full parallel hydrate.
#                         Bundles go-ivm:feat-snapshotter-in-go.
#                         tags: tablesrc-...
#   - shadow-tablesrc:    TS source of truth, Go in parallel for drift
#                         audit. Bundles go-ivm:feat-snapshotter-in-go.
#                         tags: shadow-tablesrc-...
#   - streaming-tablesrc: Same Go-primary + full parallelization config as
#                         tablesrc, but bundles the streaming-hydrate
#                         sidecar (go-ivm:feat-streaming-hydrate — true
#                         streaming hydrate, K=P×Cmax parallel reader pool).
#                         tags: streaming-tablesrc-...
#
# `pull: true` forces the build to re-fetch the go-ivm image so the
# chain "push to go-ivm → push to mono" reliably bundles the latest
# sidecar binary in every variant.

on:
  push:
    branches:
      - feat/go-ivm-sidecar-async-advance
      - feat/snapshotter-in-go
    tags: ['v*']
  pull_request:
    branches:
      - feat/go-ivm-sidecar-async-advance
      - feat/snapshotter-in-go
    paths:
      # Only run on PRs that touch files the docker build cares about,
      # so unrelated PRs don't pay the multi-minute build cost.
      - 'packages/zero-cache/**'
      - 'packages/zero-protocol/**'
      - 'packages/zero-schema/**'
      - 'packages/zql/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-zero-cache-go.yml'
  workflow_dispatch:
  # Fired by the go-ivm "Build & publish sidecar image" workflow after a
  # new sidecar image is pushed to GHCR. This eliminates the race where a
  # marker commit to this repo could trigger a rebuild BEFORE go-ivm
  # finishes publishing, causing the bundled binary to be one version
  # stale. See go-ivm/.github/workflows/build-image.yml's
  # `notify-downstream` job for the dispatcher.
  repository_dispatch:
    types: [go-ivm-published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/zero-cache-go

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # TableSource Go-primary — Go reads SQLite directly, derives
          # its own diff (trigger), TS walks internal tables only (lean).
          # Run-and-go image for production Go-primary deployment.
          - mode: tablesrc
            shadow_mode_arg: "false"
            source_mode_arg: "table"
            go_primary_trigger_arg: "true"
            lean_primary_arg: "true"
            advance_drive_arg: "true"
            go_ivm_image: "ghcr.io/kartikparsoya-eng/go-ivm:feat-snapshotter-in-go"
            tag_prefix: "tablesrc-"
          # Shadow + TableSource — TS serves (zero risk), Go runs in
          # parallel for high-coverage drift validation. Use for pre-prod
          # soaks before flipping to tablesrc-primary.
          - mode: shadow-tablesrc
            shadow_mode_arg: "true"
            source_mode_arg: "table"
            go_primary_trigger_arg: "false"
            lean_primary_arg: "false"
            advance_drive_arg: "true"
            go_ivm_image: "ghcr.io/kartikparsoya-eng/go-ivm:feat-snapshotter-in-go"
            tag_prefix: "shadow-tablesrc-"
          # Streaming-hydrate Go-primary — identical Go-primary serving +
          # full parallelization config as `tablesrc`, but bundles the
          # sidecar binary built from the go-ivm feat/streaming-hydrate
          # branch (true streaming hydrate with a K=P×Cmax parallel reader
          # pool). Requires the go-ivm build workflow to publish the
          # feat-streaming-hydrate tag (its push-branch list must include
          # feat/streaming-hydrate), else this variant's FROM pull fails.
          - mode: streaming-tablesrc
            shadow_mode_arg: "false"
            source_mode_arg: "table"
            go_primary_trigger_arg: "true"
            lean_primary_arg: "true"
            advance_drive_arg: "true"
            go_ivm_image: "ghcr.io/kartikparsoya-eng/go-ivm:feat-streaming-hydrate"
            tag_prefix: "streaming-tablesrc-"

    name: build (${{ matrix.mode }})

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # Needed for both push (write) and pulling the go-ivm base image
        # if it's private. Harmless when go-ivm image is public.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # The flavor prefix is applied to tags that DON'T set their own
          # prefix (type=ref, type=raw, latest). type=sha sets its own
          # prefix=sha- by default, which would OVERRIDE the flavor prefix —
          # so we set its prefix explicitly below to keep the variant prefix.
          flavor: |
            prefix=${{ matrix.tag_prefix }},onlatest=true
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            # Variant-prefixed sha tag. Without the explicit prefix, both
            # tablesrc and shadow-tablesrc emit the SAME unprefixed
            # `sha-<commit>` tag and clobber each other (last build wins) —
            # so it could not be used to pin a specific variant.
            type=sha,format=short,prefix=${{ matrix.tag_prefix }}sha-
            # Guaranteed-unique-per-build handle. The same mono commit is
            # rebuilt by the downstream go-ivm dispatch with a fresh sidecar
            # binary, so a commit sha alone is NOT unique per build; the run
            # id is. Pin deploys to `<prefix>run-<id>` for an immutable image.
            type=raw,value=run-${{ github.run_id }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/feat/go-ivm-sidecar-async-advance' }}

      - name: Build & push image (${{ matrix.mode }})
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/zero-cache/Dockerfile.go-ivm
          # Force-pull the go-ivm base image so we always bundle the
          # latest sidecar binary — without this, a cached older
          # version would silently get baked in.
          pull: true
          # PRs build (verifies the Dockerfile still compiles) but
          # don't push (no image churn from forks).
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            SHADOW_MODE=${{ matrix.shadow_mode_arg }}
            SOURCE_MODE=${{ matrix.source_mode_arg }}
            GO_PRIMARY_TRIGGER=${{ matrix.go_primary_trigger_arg }}
            LEAN_PRIMARY=${{ matrix.lean_primary_arg }}
            ADVANCE_DRIVE=${{ matrix.advance_drive_arg }}
            GO_IVM_IMAGE=${{ matrix.go_ivm_image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache scoped per-matrix-variant so primary and shadow don't
          # invalidate each other (they share most layers but the final
          # ENV layer differs).
          cache-from: type=gha,scope=${{ matrix.mode }}
          cache-to: type=gha,mode=max,scope=${{ matrix.mode }}
