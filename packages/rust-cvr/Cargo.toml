[package]
name = "rust-cvr"
version = "0.1.0"
edition = "2024"

[lib]
name = "rust_cvr"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
rustc-hash = "2"
xxhash-rust = { version = "0.8", features = ["xxh32"] }
parking_lot = "0.12"
tokio = { version = "1", features = ["full", "sync"] }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "postgres",
  "json",
  "uuid",
  "chrono",
  "macros",
] }
thiserror = "2"
tokio-stream = "0.1"
futures-core = "0.3"
futures-util = "0.3"

[dev-dependencies]
proptest = "1"
