[package]
name = "rust-cvr"
version = "0.1.0"
edition = "2024"

[lib]
name = "rust_cvr"
path = "src/lib.rs"

[dependencies]
tracing = "0.1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
rustc-hash = "2"
xxhash-rust = { version = "0.8", features = ["xxh32"] }
parking_lot = "0.12"
tokio = { version = "1", features = ["full", "sync"] }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "postgres",
  "json",
  "uuid",
  "chrono",
  "macros",
] }
thiserror = "2"
tokio-stream = "0.1"
futures-core = "0.3"
futures-util = "0.3"
# OTel API only — instruments bind to the global `zero` meter installed by the
# rust-syncer binary (which owns the SDK + OTLP exporter). No SDK dep here, so a
# standalone rust-cvr (no provider) makes these instruments cheap no-ops.
opentelemetry = "0.32.0"

[dev-dependencies]
criterion = "0.5"
# Capture emitted log records so a test can pin WHERE a TS `lc.info?.` line is
# (and is not) produced — see `caught_up_is_logged_at_start_poke_not_at_end`.
tracing-subscriber = "0.3"

proptest = "1"
# dhat: heap-profiling harness (tests/cvr_leak_profile.rs, #[ignore]d) that churns
# the per-advance CVRQueryDrivenUpdater.received() path to catch retained-block
# leaks in CVR state, mirroring rust-ivm's advance_leak_profile.
dhat = "0.3"

[[bench]]
name = "version_bench"
harness = false
