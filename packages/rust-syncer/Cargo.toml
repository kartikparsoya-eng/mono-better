[package]
name = "rust-syncer"
version = "0.1.0"
edition = "2024"

[features]
# Local/system-SQLite tests need WAL fallback. Production builds disable
# defaults and require the WAL2 replica format exactly like the TS snapshotter.
default = ["non-wal2-test-support"]
non-wal2-test-support = ["rust-ivm/non-wal2-test-support"]
# dhat-heap: build with `--features dhat-heap` to install dhat's heap-profiling
# global allocator and dump `dhat-heap.json` on graceful shutdown. Off by default
# (dhat intercepts every allocation, so it carries real overhead) — it exists to
# attribute a process-level RSS leak (e.g. the G6 climb) that the rust-ivm engine
# harness — which is heap-flat — cannot see. NOTE: dhat only tracks RUST
# allocations; SQLite's page cache / mmap / C-side allocations are invisible to
# it, so a retained snapshot connection leaks RSS while dhat stays flat.
dhat-heap = ["dep:dhat"]

[[bin]]
name = "rust-syncer"
path = "src/main.rs"

[dependencies]
rust-cvr = { path = "../rust-cvr" }
rust-ivm = { path = "../rust-ivm", default-features = false }
# Optional heap profiler; enabled only by the `dhat-heap` feature.
dhat = { version = "0.3", optional = true }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
base64 = "0.22"
url = "2"
urlencoding = "2"
dashmap = "6"
thiserror = "2"
async-trait = "0.1"
axum = "0.7"
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "postgres",
] }
rusqlite = { version = "0.32" }
jsonwebtoken = "9"
# glibc malloc_trim for the periodic RSS-return task (linux-gnu only): freed
# pipeline/row memory otherwise stays in malloc arenas and reads as a leak.
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
opentelemetry = "0.32.0"
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio"] }
# OTLP over HTTP/protobuf — matches the TS zero-cache
# (@opentelemetry/exporter-metrics-otlp-http, port 4318), so both engines push to
# the same collector endpoint (OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318).
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = [
  "metrics",
  "http-proto",
  # BLOCKING reqwest client: the SDK's PeriodicReader exports on its own dedicated
  # thread (not a tokio runtime), so the async client panics there with "no
  # reactor running". The blocking client makes the synchronous POST that thread
  # needs.
  "reqwest-blocking-client",
] }

[build-dependencies]
cc = "1"
