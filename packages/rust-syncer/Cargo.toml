[package]
name = "rust-syncer"
version = "0.1.0"
edition = "2024"

[features]
# Local/system-SQLite tests need WAL fallback. Production builds disable
# defaults and require the WAL2 replica format exactly like the TS snapshotter.
default = ["non-wal2-test-support"]
non-wal2-test-support = ["rust-ivm/non-wal2-test-support"]

[[bin]]
name = "rust-syncer"
path = "src/main.rs"

[dependencies]
rust-cvr = { path = "../rust-cvr" }
rust-ivm = { path = "../rust-ivm", default-features = false }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
url = "2"
urlencoding = "2"
dashmap = "6"
thiserror = "2"
async-trait = "0.1"
axum = "0.7"
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "postgres",
] }
rusqlite = { version = "0.32" }
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
opentelemetry = "0.32.0"
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio"] }
# OTLP over HTTP/protobuf — matches the TS zero-cache
# (@opentelemetry/exporter-metrics-otlp-http, port 4318), so both engines push to
# the same collector endpoint (OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318).
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = [
  "metrics",
  "http-proto",
  "reqwest-client",
] }

[build-dependencies]
cc = "1"
