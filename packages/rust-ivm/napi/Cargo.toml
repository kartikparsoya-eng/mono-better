[package]
name = "rust-ivm-napi"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
rust-ivm = { path = ".." }
napi = { version = "2", features = ["napi8", "serde-json"] }
napi-derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustc-hash = "2"
rusqlite = { version = "0.32" }

[target.'cfg(target_env = "gnu")'.dependencies]
libc = "0.2"

[build-dependencies]
napi-build = "2"
