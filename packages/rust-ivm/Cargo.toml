[package]
name = "rust-ivm"
version = "0.1.0"
edition = "2024"

[lib]
name = "rust_ivm"
path = "src/lib.rs"

[[bin]]
name = "rust-ivm-server"
path = "src/bin/server.rs"

[[bin]]
name = "replay"
path = "src/bin/replay.rs"

[features]
# Enables the wal2 co-located-read pool path (sqlite3_wal2_coread_* FFI). These
# symbols exist only in the SQLITE_ENABLE_WAL2_COREAD fork linked as system
# SQLite (the Dockerfile); the local macOS build has no such symbols, so the
# feature is OFF by default and the coread module is compiled out. Mirrors the
# Go port's `//go:build libsqlite3` tag (go-ivm coread.go / coread_stub.go).
wal2_coread = []

[dependencies]
rayon = "1"
parking_lot = "0.12"
crossbeam = "0.8"
smallvec = "1"
rustc-hash = "2"
rusqlite = { version = "0.32" }
regex-lite = "0.1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tiny_http = "0.12"

[dev-dependencies]
proptest = "1"
pprof = { version = "0.13", features = ["flamegraph"] }
