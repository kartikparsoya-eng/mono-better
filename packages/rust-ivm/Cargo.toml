[package]
name = "rust-ivm"
version = "0.1.0"
edition = "2024"

[lib]
name = "rust_ivm"
path = "src/lib.rs"

[[bin]]
name = "rust-ivm-server"
path = "src/bin/server.rs"

[[bin]]
name = "replay"
path = "src/bin/replay.rs"

[dependencies]
rayon = "1"
parking_lot = "0.12"
crossbeam = "0.8"
smallvec = "1"
rustc-hash = "2"
rusqlite = { version = "0.32" }
regex-lite = "0.1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tiny_http = "0.12"

[dev-dependencies]
proptest = "1"
