[package]
name = "rust-ivm"
version = "0.1.0"
edition = "2024"

[lib]
name = "rust_ivm"
path = "src/lib.rs"

[features]
# macOS/system-SQLite unit tests cannot create wal2 databases. Production NAPI
# disables this feature and requires wal2 exactly like the TS Snapshotter.
default = ["non-wal2-test-support"]
non-wal2-test-support = []
# Marks the IVM hot path `#[inline(never)]` so a CPU profiler can attribute
# self-time INSIDE the engine. Release inlining otherwise collapses join/exists/
# table-source fetch into the caller, which is why a flamegraph of a slow hydrate
# showed 83% self in `IvmPipelines::hydrate` and 0 samples in the operators.
# Enabled transitively by rust-syncer's `profiling` feature; never in prod.
profiling = []

[[bin]]
name = "rust-ivm-server"
path = "src/bin/server.rs"

[[bin]]
name = "replay"
path = "src/bin/replay.rs"

[dependencies]
indexmap = "2"
parking_lot = "0.12"
rustc-hash = "2"
rusqlite = { version = "0.32" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
tiny_http = "0.12"
rust-cvr = { path = "../rust-cvr" }
# OTel API only — the `zero.sync.ivm.advance-time` histogram binds to the global
# `zero` meter installed by the rust-syncer binary (SDK/exporter live there).
opentelemetry = "0.32.0"
regex = "1.13.1"

[dev-dependencies]
proptest = "1"
pprof = { version = "0.13", features = ["flamegraph"] }
# dhat: heap-profiling harnesses (tests/advance_leak_*.rs, #[ignore]d).
dhat = "0.3"
criterion = "0.5"

# Axis-8 microbenchmarks for the two innermost IVM hot units — the row-set
# signature h64 (every advance/emit) and the sort comparator (every merge /
# binary_search). Run `cargo bench`; pin/compare with `--save-baseline <name>`.
[[bench]]
name = "ivm_hot_bench"
harness = false
