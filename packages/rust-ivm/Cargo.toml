[package]
name = "rust-ivm"
version = "0.1.0"
edition = "2024"

[lib]
name = "rust_ivm"
path = "src/lib.rs"

[features]
# macOS/system-SQLite unit tests cannot create wal2 databases. Production NAPI
# disables this feature and requires wal2 exactly like the TS Snapshotter.
default = ["non-wal2-test-support"]
non-wal2-test-support = []

[[bin]]
name = "rust-ivm-server"
path = "src/bin/server.rs"

[[bin]]
name = "replay"
path = "src/bin/replay.rs"

[dependencies]
parking_lot = "0.12"
rustc-hash = "2"
rusqlite = { version = "0.32" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
tiny_http = "0.12"
rust-cvr = { path = "../rust-cvr" }
# OTel API only — the `zero.sync.ivm.advance-time` histogram binds to the global
# `zero` meter installed by the rust-syncer binary (SDK/exporter live there).
opentelemetry = "0.32.0"
regex = "1.13.1"

[dev-dependencies]
proptest = "1"
pprof = { version = "0.13", features = ["flamegraph"] }
# dhat: heap-profiling harnesses (tests/advance_leak_*.rs, #[ignore]d).
dhat = "0.3"
